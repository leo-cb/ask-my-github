# Pre-commit hooks configuration
# Run `pre-commit install` after cloning to activate the hooks.
# Run `pre-commit run --all-files` to run all hooks against every file.

repos:
  - repo: local
    hooks:
      # Runs the gitleaks binary installed on the system (e.g. via winget).
      # The upstream `gitleaks` hook needs Go and `gitleaks-docker` needs
      # Docker, so a local hook keeps this dependency-free.
      - id: gitleaks
        name: Detect hardcoded secrets
        description: Detect hardcoded secrets using Gitleaks
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false
