[project]
name = "ask-my-github"
version = "0.1.0"
description = "Fetches GitHub repositories for a user, loads README content, and builds a FAISS vector store with sentence-transformer embeddings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain",
    "langchain-community",
    "langchain-core",
    "langchain-huggingface",
    "langchain-ollama",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-text-splitters",
    "langgraph",
    "langgraph-prebuilt",
    "langsmith",
    "sentence-transformers",
    "faiss-cpu",
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic-settings",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ask_my_github"]
